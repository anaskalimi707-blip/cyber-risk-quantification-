services:
  # CyberOptix Backend API Service
  - type: web
    name: cyberoptix-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: cyberoptix-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cyberoptix-redis
          property: connectionString

  # CyberOptix Frontend Static Site
  - type: static
    name: cyberoptix-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cyberoptix-backend
          property: host

databases:
  - name: cyberoptix-postgres
    databaseName: cyberoptix_prod
    user: cyberoptix
    plan: free

  - name: cyberoptix-redis
    plan: free
