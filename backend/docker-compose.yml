services:
  cyberoptix-backend:
    build: .
    container_name: cyberoptix-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:///./cyberoptix.db
      - SECRET_KEY=cyberoptix-enterprise-production-signing-key-2026
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
